[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf2ogc"
version = "0.3.0"
description = "CF-compliant NetCDF to rasters an OGC service can serve (gridded fields and point clouds to GeoTIFF)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Massimo Di Stefano", email = "massimods@met.no" }]
keywords = ["netcdf", "cf-conventions", "point-cloud", "cog", "geotiff", "ogc", "wms", "wcs", "hyspex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "dask[array]>=2023.1",
    "netCDF4>=1.6",
    "rasterio>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The JIT accumulators of the fast implementation (parallel_mode numba).
numba = ["numba>=0.58"]
# cf2ogc.grid; it also needs GDAL's Python bindings (osgeo) from the system's GDAL.
grid = ["pyproj>=3.4"]
test = ["pytest>=8", "cftime>=1.6"]

[project.scripts]
cf2ogc = "cf2ogc.cli:main"

[project.urls]
Homepage = "https://github.com/metno/cf2ogc"
Source = "https://github.com/metno/cf2ogc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
