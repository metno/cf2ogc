name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python }}${{ matrix.numba && ', numba' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numba: false
          - python: "3.12"
            numba: true
          - python: "3.13"
            numba: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # rasterio and netCDF4 wheels carry their own GDAL and HDF5, so no
      # system packages are needed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test${{ matrix.numba && ',numba' || '' }}]"
      - name: Show environment
        run: python -c "import cf2ogc, numpy, xarray, rasterio; from cf2ogc.points import _NUMBA_AVAILABLE; print('cf2ogc', cf2ogc.__version__, '| numpy', numpy.__version__, '| xarray', xarray.__version__, '| rasterio', rasterio.__version__, '| numba', _NUMBA_AVAILABLE)"
      - name: Run tests
        run: python -m pytest -q -rs
      - name: Command line
        run: cf2ogc --version

  grid:
    # cf2ogc.grid needs GDAL's own Python bindings, which have no wheel: use
    # the system's (GDAL 3.8 on Ubuntu 24.04). They are built against NumPy 1,
    # so NumPy stays below 2 in this job.
    name: tests with the system GDAL (cf2ogc.grid)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gdal python3-venv
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          echo "numpy<2" > constraints.txt
          PIP_CONSTRAINT=constraints.txt python -m pip install -e ".[test,grid]"
      - name: Show environment
        run: .venv/bin/python -c "from osgeo import gdal; import numpy, pyproj, cf2ogc; print('cf2ogc', cf2ogc.__version__, '| gdal', gdal.__version__, '| numpy', numpy.__version__, '| pyproj', pyproj.__version__)"
      - name: Run tests
        run: .venv/bin/python -m pytest -q -rs

  package:
    name: packaging metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      # Catches a malformed pyproject or an unreadable README before anyone
      # tries to install the package.
      - name: Build and check the distribution
        run: |
          python -m build
          python -m twine check dist/*
